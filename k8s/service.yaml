apiVersion: v1
kind: Service
metadata:
  name: fraud-service
spec:
  type: LoadBalancer  # Exposes externally (cloud provider gives IP)
  selector:
    app: fraud-inference  # Routes to pods with this label
  ports:
  - name: http
    protocol: TCP
    port: 80          # External port clients connect to
    targetPort: 8000  # Container port receiving traffic
  - name: metrics
    protocol: TCP
    port: 8001
    targetPort: 8001