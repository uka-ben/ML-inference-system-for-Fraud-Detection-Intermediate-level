apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-network-policy
spec:
  podSelector:
    matchLabels:
      app: fraud-inference
  policyTypes:
  - Ingress  # Incoming traffic rules
  - Egress   # Outgoing traffic rules
  ingress:
  # Allow only from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow only to monitoring
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090